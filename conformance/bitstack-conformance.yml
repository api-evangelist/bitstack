note: >-
  Bitstack's conformance posture is REGULATORY, not technical. It holds real, named financial licences
  and publishes the mandatory policy documents that go with them, but it publishes no API, therefore no
  API-level standard (OAuth2, OIDC, RFC 9457, pagination, idempotency) can be asserted either way. Every
  API-standard row below is recorded as not-applicable rather than false, so an absent API is not read as
  a failed one. No security certification (SOC 2, ISO 27001, PCI DSS) is claimed anywhere on the site;
  the security page says only that "our platform is regularly audited by IT security experts" without
  naming an auditor, scope, or report.
