aid: bitstack
name: Bitstack
description: 'Bitstack is a French consumer Bitcoin savings application operated by Bitstack Digital Assets
  SAS (Meyreuil, France), which lets retail users accumulate Bitcoin through automatic round-ups on
  everyday card purchases, recurring dollar-cost-averaging buys (hourly to monthly), one-off card buys
  from EUR 1, peer-to-peer transfers by phone number or email, a cash account with free SEPA instant
  transfers, and a Bitstack payment card that pays Bitcoin cashback. The company reports more than
  350,000 users and over EUR 350M invested through the app. It is licensed as a Crypto-Assets Service
  Provider with the French Autorite des Marches Financiers (AMF) under number A2025-003 for exchange,
  order execution, custody and transfer of crypto-assets, and is a licensed agent of the electronic
  money institution Xpollens with the ACPR under number 747088. Bitstack publishes a public fee
  schedule and a regulatory documents hub, but ships no public developer API, developer portal, or
  machine-readable API contract of any kind: the product is delivered exclusively through its iOS and
  Android applications.'
